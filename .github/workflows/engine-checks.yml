name: independent engine checks
on:
  push:
    branches: [feat/order-astra-engine-20261101, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run test:engine
      - run: npm run example:engine
      - run: npm run build:engine
