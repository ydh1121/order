name: independent engine checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  ORDER_QA_CONTRACT: MSG0540
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run test:engine
      - run: npm run example:engine
      - run: npm run build:engine
      - run: npm run build
  chromium-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Select installed runner Chrome or install pinned Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install Korean glyphs for matched baseline and current captures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match ':lang=ko'
          dpkg-query -W fonts-noto-cjk
      - run: npm run build
      - name: Actual Chromium DOM with synthetic phone input
        run: |
          mkdir -p browser-evidence
          node test/engine/phone-browser.smoke.mjs > browser-evidence/phone.json 2> browser-evidence/phone.stderr.log
          cat browser-evidence/phone.json
      - name: Built product transactions with synthetic DNS and contact fixtures
        run: node test/browser/product.smoke.mjs
      - name: Feedback regression and matched baseline screenshots
        if: always()
        run: node test/browser/feedback.smoke.mjs
      - name: Address pattern 1 transactions, request lifecycle and full viewport motion
        if: always()
        run: node test/browser/address.smoke.mjs
      - name: Native durable storage, profile relaunch and concurrent tabs
        if: always()
        run: node test/browser/storage.smoke.mjs
      - name: Same-commit isolated local QA LAB
        if: always()
        run: |
          npm run build:qa-lab
          node test/browser/qa-lab.smoke.mjs .qa-lab/order-qa-lab.html
          cp .qa-lab/order-qa-lab.html browser-evidence/qa-lab/order-qa-lab.html
      - name: Computed styles against frozen UX source
        if: always()
        run: node test/browser/styles.smoke.mjs
      - name: Actual HTTPS DNS observation from external origin
        if: always()
        run: |
          mkdir -p browser-evidence
          status=0
          node scripts/engine/browser-email-smoke.mjs https://example.com --expanded > browser-evidence/email-external-origin.json 2> browser-evidence/email.stderr.log || status=$?
          cat browser-evidence/email-external-origin.json
          if [ "$status" = 3 ]; then
            echo 'External-origin HTTPS DNS observation: ONLINE_INCONCLUSIVE. Canonical product acceptance remains untested.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - name: Keep observations separate from canonical product acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-adapter-observations-${{ github.run_id }}
          path: browser-evidence/
          retention-days: 14
  chromium-user-rework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Select installed runner Chrome or install pinned Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install Korean glyphs for matched b9d baseline and current captures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match ':lang=ko'
          dpkg-query -W fonts-noto-cjk
      - run: npm run build
      - name: MSG0521 dirty transactions, quantity and common UI on current source
        run: node test/browser/rework.smoke.mjs
      - name: Preserve the one-request canonical address observation budget
        if: always()
        run: |
          mkdir -p browser-evidence/rework
          echo '{"message":"MSG0540","status":"NOT_RUN_REQUEST_BUDGET_RESERVED","reason":"The execution owner performs one representative canonical request after the target deployment. CI never repeats paid provider calls."}' > browser-evidence/rework/canonical-address-observation.json
      - name: Observe current email policy from the actual canonical HTTPS origin
        if: always()
        run: |
          mkdir -p browser-evidence/rework
          status=0
          node scripts/engine/browser-email-smoke.mjs https://order-ooo.pages.dev --product-policy > browser-evidence/rework/email-product-policy.json 2> browser-evidence/rework/email-product-policy.stderr.log || status=$?
          cat browser-evidence/rework/email-product-policy.json
          if [ "$status" = 3 ]; then
            echo 'Current source email policy on canonical HTTPS: ONLINE_INCONCLUSIVE. Provider evidence is retained; this is not product or user acceptance.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - name: Preserve current-source rework and separate provider observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-user-rework-observations-${{ github.run_id }}
          path: browser-evidence/rework/
          retention-days: 14

  chromium-canonical-q4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Select installed runner Chrome or install pinned Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install Korean glyphs for identical before and after rendering
        run: |
          . /etc/os-release
          test "$ID:$VERSION_ID:${VERSION_CODENAME:-}" = "ubuntu:24.04:noble"
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('/etc/apt/apt-mirrors.txt')
          original = path.read_text()
          updated, count = re.subn(
              r'(?m)^http://azure\.archive\.ubuntu\.com/ubuntu/?(?=\s|$)',
              'https://archive.ubuntu.com/ubuntu/',
              original,
          )
          if count != 1:
              raise SystemExit('Unexpected Ubuntu mirror configuration')
          path.write_text(updated)
          PY
          font_apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1)
          sudo apt-get "${font_apt_options[@]}" -o APT::Update::Error-Mode=any update -qq
          sudo apt-get "${font_apt_options[@]}" install -y 'fonts-noto-cjk=1:20230817+repack1-3'
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3'
          dpkg-query -W fonts-noto-cjk
          fc-match ':lang=ko'
      - run: npm run build
      - name: MSG0540 approved nine groups on actual product source
        run: node test/browser/msg0540.smoke.mjs
      - name: MSG0528 actual Q1–Q4, checkpoint, quantities and calendar boundaries
        if: always()
        run: node test/browser/q1-q4-0528.smoke.mjs
      - name: Preserved MSG0526 compatible regressions with explicit superseded contracts
        if: always()
        env:
          ORDER_QA_CONTRACT: MSG0540
          ORDER_0526_FUNCTIONAL_ONLY: '1'
        run: node test/browser/canonical-q4-0526.smoke.mjs
      - name: Single offline comparison HTML from both fixed Git graphs
        if: always()
        run: |
          git worktree add --detach "$RUNNER_TEMP/order-before-0528" a1cdfb61a4b908a0ae93ee32d03e8f657623e182
          node scripts/build-qa-comparison.mjs --message MSG0528 --baseline "$RUNNER_TEMP/order-before-0528" --out browser-evidence/q1-q4-0528/order-before-after.html
          node test/browser/qa-comparison.smoke.mjs browser-evidence/q1-q4-0528/order-before-after.html
      - name: Preserve MSG0540 observations separately from preserved regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-canonical-q4-observations-${{ github.run_id }}
          path: |
            browser-evidence/q1-q4-0528/
            browser-evidence/q4-0526/
            browser-evidence/msg0540/
          retention-days: 14
